name: CI

on:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # The system-gfortran quick tests and the GCC build with the full suite take
  # 15 to 30 minutes each and run in nightly.yml.
  sync-check:
    name: Validate sync script
    runs-on: [self-hosted, itp-ubuntu24]
    steps:
      - uses: actions/checkout@v4

      - name: Validate sync script syntax
        run: bash -n sync-from-gcc.sh

      - name: Check script is executable
        run: test -x sync-from-gcc.sh

      - name: Verify .gcc-commit file exists
        run: |
          if [ ! -f .gcc-commit ]; then
            echo "::error::.gcc-commit file is missing"
            exit 1
          fi
          echo "Tracked GCC commit: $(cat .gcc-commit)"

      - name: Test the nightly triage logic
        run: python3 scripts/test_nightly_triage.py
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
